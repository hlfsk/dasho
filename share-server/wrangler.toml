# share-server/wrangler.toml — конфиг Cloudflare Worker для DÄSHO share.
#
# После создания KV-неймспейса (см. README) — впиши id ниже.

name = "dasho-share"
main = "worker.js"
compatibility_date = "2024-12-01"

# KV-хранилище для сохранённых сцен.
# id получишь после команды:  wrangler kv namespace create SCENES
[[kv_namespaces]]
binding = "SCENES"
id = "ВПИШИ_СЮДА_ID_ИЗ_wrangler_kv_namespace_create"
